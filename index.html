<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>共同行程表</title>
    <link rel="stylesheet" href="style.css">
    <!-- Using CryptoJS for AES encryption to satisfy the requirement -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
    <div id="login-container" class="container">
        <h1>📅 進入行程表</h1>
        <p>請輸入密碼以存取共同行程表</p>
        <input type="password" id="password-input" placeholder="請輸入密碼">
        <button id="login-btn">進入</button>
        <p id="login-error" class="error"></p>
    </div>

    <div id="app-container" class="container hidden">
        <header>
            <h1>📅 共同行程表</h1>
            <div class="month-controls">
                <button id="prev-month">&lt;</button>
                <h2 id="current-month-display">2026年 9月</h2>
                <button id="next-month">&gt;</button>
            </div>
            <button id="today-btn">回到今天</button>
        </header>

        <div class="calendar">
            <div class="weekdays">
                <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
            </div>
            <div class="days" id="calendar-days">
                <!-- Days will be generated by JS -->
            </div>
        </div>

        <div id="task-panel" class="hidden">
            <h3 id="selected-date-display">選擇的日期</h3>
            <div id="task-list">
                <!-- Tasks will be injected here -->
            </div>
            <div class="add-task-container">
                <input type="text" id="new-task-input" placeholder="新增行程...">
                <button id="add-task-btn">新增</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
